name: Verify environment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --extra harbor --extra dev --extra detection-eval --locked
      # Numeric task/schema validation needs safetensors, not the TRL runtime.
      - run: uv pip install --no-deps safetensors==0.8.0
      - run: uv pip check
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run vision-rl demo --output runs/ci-demo
  detection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --extra dev --extra detection-eval --locked
      - run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
      - run: uv pip install -r requirements-detection.txt
      - run: uv pip install setuptools==78.1.0
      - name: Install the official wheat evaluator
        env:
          FORCE_ONLY_CPU: "1"
          MAX_JOBS: "2"
        run: uv pip install --no-deps --require-hashes --no-build-isolation -r requirements-wheat-eval.lock
      - run: uv pip check
      - run: .venv/bin/pytest -q
  local-vlm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Harbor's LiteLLM dependencies conflict with the pinned TRL stack.
      # The cpu job checks the actual Harbor schema in its separate environment.
      - run: uv sync --extra dev --locked
      - run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
      - run: uv pip install --no-deps --require-hashes -r requirements-vlm-local.lock
      - run: uv pip check
      - name: Check the pinned TRL stack without loading a model
        run: .venv/bin/python -m vision_rl.vlm_local_training --preflight --device cpu
      - name: Verify local training, continuation and grading contracts
        env:
          AIRCRAFT_LOADER_PARITY: "1"
        run: >-
          .venv/bin/pytest -q tests/test_vlm_local_training.py tests/test_vlm.py
          tests/test_aircraft_recipe.py tests/test_aircraft_evaluator.py
          tests/test_vlm_local_task_builder.py tests/test_aircraft_cpu_loader.py
          tests/test_expanded_lora.py
      - run: docker build -f Dockerfile.vlm -t vision-rl:vlm-local .
      - name: Check the installed container with networking disabled
        run: docker run --rm --network none vision-rl:vlm-local
  harbor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --extra harbor --extra dev --locked
      - run: docker build -t vision-rl:local .
      - run: uv run harbor run -p tasks/spatial-specialist -a oracle --job-name oracle-check
      - run: uv run python scripts/check_harbor.py jobs/oracle-check --min-reward 0.90
      - run: uv run harbor run -p tasks/spatial-specialist -a nop --job-name nop-check
      - run: uv run python scripts/check_harbor.py jobs/nop-check --max-reward 0.0
      - run: uv run harbor run -p tasks/spatial-specialist --agent vision_rl.harbor_agent:TrainingAgent --job-name agent-check
      - run: uv run python scripts/check_harbor.py jobs/agent-check --min-reward 0.90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harbor-verifier-evidence
          path: jobs/
