schema_version = "1.4"

[task]
name = "vision-rl/spatial-specialist"
version = "0.1.0"
description = "Train a specialist visual policy and submit weights for independent evaluation"

[metadata]
category = "machine-learning"
purpose = "onboarding"
benchmark = "synthetic-spatial-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[environment]
docker_image = "vision-rl:local"
cpus = 2
memory_mb = 2048
storage_mb = 4096

[verifier.environment]
cpus = 1
memory_mb = 1024
storage_mb = 2048
